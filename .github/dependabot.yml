version: 2

# The deploy actions sat on a runtime GitHub had already deprecated before
# anyone noticed. This opens the update as a pull request instead, monthly and
# grouped, so it is one review rather than a stream of them.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'Bump'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # Next, React and the types move together; splitting them into separate
      # pull requests only produces ones that cannot be merged on their own.
      app:
        patterns: ['*']
    ignore:
      # TypeScript 7 is the native compiler, shipped as a per-platform binary,
      # and no android-arm64 build is published — this repo is worked on from
      # Termux, where `tsc` and `next build` then both refuse to start. CI on
      # ubuntu would go green and hide it. Take the major by hand, once that
      # platform exists.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'Bump'
