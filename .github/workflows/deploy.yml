name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Once a day as well, so a new upload on the YouTube channel reaches the
  # timeline without a push. Off the hour so it does not queue behind every
  # other repository's midnight job.
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

# Only the built site is published; nothing writes back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy instead of queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from the custom domain arn-c0de.de at the root, so assets must
      # not carry a project-name prefix. (Was "/website" while the site lived
      # under arn-c0de.github.io/website/.)
      PAGES_BASE_PATH: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Pure-function tests over the config rules, the stack aggregations and
      # the request builder — they run straight through node --test.
      - run: npm test

      # Latest uploads of the YouTube channel for the timeline: titles, a short
      # summary and local thumbnails. Never fails the build — without YouTube
      # the committed data/videos.json is used as it is.
      - run: node scripts/fetch-videos.mjs

      # Each project's readme, baked into its page so search engines see the
      # text. Never fails the build — a missing readme loads in the browser.
      - run: node --import ./scripts/test-setup.mjs scripts/fetch-readmes.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run build

      # Pages serves the artifact as-is; without this file it would run the
      # output through Jekyll and drop directories starting with an underscore.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
