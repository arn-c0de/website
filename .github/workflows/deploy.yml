name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the built site is published; nothing writes back to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy instead of queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # This is a project Pages site, published below the repository name.
      PAGES_BASE_PATH: /website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Pure-function tests over the config rules, the stack aggregations and
      # the request builder — they run straight through node --test.
      - run: npm test

      - run: npm run build

      # Pages serves the artifact as-is; without this file it would run the
      # output through Jekyll and drop directories starting with an underscore.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
